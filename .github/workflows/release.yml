name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install --editable .
      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cursor-chat-cleaner
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  update-homebrew:
    name: Update Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch PyPI metadata
        id: pypi
        run: |
          python - <<'PY'
          import json, os, urllib.request

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with urllib.request.urlopen(f"https://pypi.org/pypi/cursor-chat-cleaner/{version}/json") as resp:
              data = json.load(resp)

          sdist = next(f for f in data["urls"] if f["packagetype"] == "sdist")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"url={sdist['url']}\n")
              out.write(f"sha256={sdist['digests']['sha256']}\n")
          PY

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: vilaca/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update formula
        run: |
          python - <<'PY'
          import os, re

          path = "Formula/cursor-chat-cleaner.rb"
          formula = open(path).read()

          # Replace only the top-level url and sha256 (before the first resource block)
          resource_pos = formula.index("  resource ")
          head, tail = formula[:resource_pos], formula[resource_pos:]

          head = re.sub(r'url ".*?"', f'url "{os.environ["PYPI_URL"]}"', head, count=1)
          head = re.sub(r'sha256 ".*?"', f'sha256 "{os.environ["PYPI_SHA256"]}"', head, count=1)

          open(path, "w").write(head + tail)
          PY
        env:
          PYPI_URL: ${{ steps.pypi.outputs.url }}
          PYPI_SHA256: ${{ steps.pypi.outputs.sha256 }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cursor-chat-cleaner.rb
          git diff --cached --quiet || git commit -m "Update cursor-chat-cleaner to ${GITHUB_REF_NAME}"
          git push

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
